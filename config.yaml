solver:
  default_timeout: 10
  allow_mip: true
  enable_fixed_cost: true

visualizations:
  theme: "plotly_dark"
  default_height: 450

ai_explainer:
  temperature: 0.3
  vision_model: "gemini-3.5-flash"
  default_provider: "google"

ui:
  default_scenario: "baseline"
  max_cost_multiplier: 3.0
  min_cost_multiplier: 0.5
